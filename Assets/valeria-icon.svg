<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2638" />
      <stop offset="50%" stop-color="#141A26" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>

    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B5E80" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#2D374D" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1A2233" stop-opacity="0.4" />
    </linearGradient>

    <radialGradient id="leafGlow" cx="42%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="sunGlow" cx="65%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Pencil Shaft Facets -->
    <linearGradient id="pencilLeftFacet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="pencilCenterFacet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <linearGradient id="pencilRightFacet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="70%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Sharpened Wood Cone -->
    <linearGradient id="woodConeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2B788" />
      <stop offset="25%" stop-color="#FBF0DF" />
      <stop offset="60%" stop-color="#ECCFB0" />
      <stop offset="100%" stop-color="#C89B6D" />
    </linearGradient>

    <!-- Graphite Lead Tip -->
    <linearGradient id="leadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Metal Ferrule -->
    <linearGradient id="ferruleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="35%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Eraser -->
    <linearGradient id="eraserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="40%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Leaves Gradients -->
    <linearGradient id="mainLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="40%" stop-color="#059669" />
      <stop offset="75%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="mainLeafShade" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="secondLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>

    <linearGradient id="thirdLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#86EFAC" />
    </linearGradient>

    <linearGradient id="budGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="50%" stop-color="#65A30D" />
      <stop offset="100%" stop-color="#A3E635" />
    </linearGradient>

    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Base Icon Background (Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bgGrad)" />
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="none" stroke="url(#rimGrad)" stroke-width="2.5" />

  <!-- Ambient Organic Glows -->
  <circle cx="210" cy="220" r="170" fill="url(#leafGlow)" />
  <circle cx="310" cy="190" r="130" fill="url(#sunGlow)" />

  <!-- MAIN GRAPHIC: Pencil + Sprouting Leaves (Angled at 45 deg) -->
  <g transform="translate(256, 256) rotate(45)">

    <!-- Ambient Drop Shadows behind pencil and foliage -->
    <g opacity="0.32" transform="translate(-10, 16)">
      <!-- Shadow of Eraser & Ferrule -->
      <rect x="-22" y="-132" width="44" height="46" rx="6" fill="#000000" />
      <!-- Shadow of Shaft -->
      <rect x="-22" y="-88" width="44" height="152" rx="4" fill="#000000" />
      <!-- Shadow of Wood Cone & Lead -->
      <polygon points="-22,64 22,64 0,138" fill="#000000" />
      <!-- Shadow of Leaves -->
      <path d="M -58 -58 C -70 -88, -94 -115, -120 -110 C -110 -80, -78 -50, -58 -58 Z" fill="#000000" />
      <path d="M -28 -15 C -48 -42, -80 -44, -92 -20 C -76 0, -46 -2, -28 -15 Z" fill="#000000" />
      <path d="M 18 -10 C 35 -38, 70 -48, 88 -32 C 80 -15, 55 -2, 18 -10 Z" fill="#000000" />
    </g>

    <!-- ==================== PENCIL BODY ==================== -->

    <!-- 1. Eraser -->
    <path d="M -19.5 -112 L -19.5 -125 C -19.5 -134, 19.5 -134, 19.5 -125 L 19.5 -112 Z" fill="url(#eraserGrad)" />
    <!-- Eraser Highlight -->
    <path d="M -13 -112 L -13 -125 C -13 -130, 2 -130, 2 -125 L 2 -112 Z" fill="#FFFFFF" opacity="0.22" />

    <!-- 2. Metallic Ferrule -->
    <rect x="-20.5" y="-112" width="41" height="24" rx="2" fill="url(#ferruleGrad)" />
    <!-- Ferrule Ribs/Grooves -->
    <line x1="-20.5" y1="-106" x2="20.5" y2="-106" stroke="#475569" stroke-width="1.2" opacity="0.5" />
    <line x1="-20.5" y1="-105" x2="20.5" y2="-105" stroke="#FFFFFF" stroke-width="0.8" opacity="0.7" />
    <line x1="-20.5" y1="-98" x2="20.5" y2="-98" stroke="#475569" stroke-width="1.2" opacity="0.5" />
    <line x1="-20.5" y1="-97" x2="20.5" y2="-97" stroke="#FFFFFF" stroke-width="0.8" opacity="0.7" />

    <!-- 3. Sharpened Wood Section (Base Layer) -->
    <polygon points="-20,60 20,60 0,135" fill="url(#woodConeGrad)" />
    <!-- Wood grain accent lines -->
    <path d="M -12 70 Q -3 95 -1 115" stroke="#D4A373" stroke-width="1" fill="none" opacity="0.6" />
    <path d="M 10 72 Q 4 98 2 118" stroke="#B88656" stroke-width="1" fill="none" opacity="0.5" />

    <!-- 4. Graphite Lead Tip -->
    <polygon points="-6,115 6,115 0,136" fill="url(#leadGrad)" />
    <!-- Graphite facet shine -->
    <polygon points="-6,115 0,115 0,136" fill="#64748B" opacity="0.4" />
    <!-- Lead tip light point reflection -->
    <circle cx="0" cy="135" r="1.2" fill="#F8FAFC" />

    <!-- 5. Hexagonal Pencil Shaft with Scalloped Tips -->
    <!-- Left Facet -->
    <path d="M -20 -88 L -7 -88 L -7 60 C -10 66, -17 66, -20 60 Z" fill="url(#pencilLeftFacet)" />

    <!-- Center Facet (Brightest, facing viewer) -->
    <path d="M -7 -88 L 7 -88 L 7 60 C 3 69, -3 69, -7 60 Z" fill="url(#pencilCenterFacet)" />

    <!-- Right Facet (In shadow) -->
    <path d="M 7 -88 L 20 -88 L 20 60 C 17 66, 10 66, 7 60 Z" fill="url(#pencilRightFacet)" />

    <!-- Crisp facet ridge highlights & bevels -->
    <line x1="-7" y1="-88" x2="-7" y2="60" stroke="#FEF3C7" stroke-width="1.2" opacity="0.75" />
    <line x1="7" y1="-88" x2="7" y2="60" stroke="#78350F" stroke-width="1.2" opacity="0.55" />

    <!-- Subtle longitudinal wood reflection on center facet -->
    <line x1="-1" y1="-80" x2="-1" y2="52" stroke="#FFFFFF" stroke-width="1.5" opacity="0.35" stroke-linecap="round" />

    <!-- ==================== SPROUTING VINES & LEAVES ==================== -->

    <!-- Botanical knot on pencil where vine originates -->
    <ellipse cx="-7" cy="22" rx="4" ry="7" fill="#78350F" opacity="0.8" />
    <ellipse cx="-6" cy="22" rx="2.5" ry="5" fill="#451A03" />

    <!-- Main Vine Branching Outward to the Left -->
    <path d="M -6 22
             C -16 14, -22 -2, -32 -22
             C -40 -38, -50 -58, -62 -82"
          fill="none" stroke="url(#stemGrad)" stroke-width="5" stroke-linecap="round" />

    <!-- Graceful Tendril Spiral at top of main stem -->
    <path d="M -62 -82
             C -70 -96, -82 -96, -82 -84
             C -82 -74, -70 -72, -72 -82"
          fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" />

    <!-- Secondary Vine wrapping around front of pencil -->
    <!-- Drop shadow cast by wrap on pencil -->
    <path d="M -18 10 Q -2 4 18 -4" stroke="#000000" stroke-width="4.5" fill="none" opacity="0.3" />
    <!-- The wrap stem -->
    <path d="M -18 8
             C -6 2, 6 -4, 18 -6
             C 28 -12, 42 -22, 56 -36"
          fill="none" stroke="url(#stemGrad)" stroke-width="4" stroke-linecap="round" />

    <!-- Tendril curl on right branch -->
    <path d="M 56 -36
             C 65 -46, 75 -44, 73 -35
             C 71 -28, 64 -30, 66 -36"
          fill="none" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" />

    <!-- Side branch to Leaf 2 -->
    <path d="M -26 -10 C -38 -14, -48 -16, -58 -18"
          fill="none" stroke="url(#stemGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- ========== LEAF 1: Large Flourishing Leaf (Upper Left) ========== -->
    <g id="Leaf1">
      <!-- Petiole -->
      <path d="M -44 -44 C -52 -54, -60 -62, -66 -68" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round" />
      
      <!-- Leaf Lower Half (Shadowed) -->
      <path d="M -64 -66
               C -82 -92, -108 -110, -126 -106
               C -114 -84, -86 -56, -64 -66 Z"
            fill="url(#mainLeafShade)" />

      <!-- Leaf Upper Half (Sunlit) -->
      <path d="M -64 -66
               C -70 -78, -102 -108, -126 -106
               C -102 -118, -78 -96, -64 -66 Z"
            fill="url(#mainLeafGrad)" />

      <!-- Central Leaf Spine / Vein -->
      <path d="M -64 -66 C -86 -88, -108 -100, -126 -106"
            fill="none" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round" opacity="0.8" />

      <!-- Delicate Side Veins -->
      <path d="M -78 -76 C -82 -72, -90 -74, -96 -70" fill="none" stroke="#6EE7B7" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
      <path d="M -88 -85 C -92 -80, -102 -84, -108 -80" fill="none" stroke="#6EE7B7" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
      <path d="M -76 -80 C -76 -88, -82 -96, -88 -100" fill="none" stroke="#A7F3D0" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
      <path d="M -90 -91 C -92 -98, -98 -104, -104 -106" fill="none" stroke="#A7F3D0" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />

      <!-- Dewdrop on Leaf 1 -->
      <ellipse cx="-92" cy="-94" rx="3.5" ry="2.5" fill="#FFFFFF" opacity="0.85" />
      <circle cx="-93" cy="-95" r="1" fill="#FFFFFF" />
    </g>

    <!-- ========== LEAF 2: Arching Side Leaf (Left) ========== -->
    <g id="Leaf2">
      <!-- Leaf Body -->
      <path d="M -54 -17
               C -72 -42, -102 -40, -114 -16
               C -96 4, -68 0, -54 -17 Z"
            fill="url(#secondLeafGrad)" />

      <!-- Leaf Central Vein -->
      <path d="M -54 -17 C -75 -24, -98 -22, -114 -16"
            fill="none" stroke="#ECFDF5" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />

      <!-- Lateral veins -->
      <path d="M -68 -20 C -74 -28, -84 -30, -92 -28" fill="none" stroke="#A7F3D0" stroke-width="1" stroke-linecap="round" opacity="0.6" />
      <path d="M -82 -20 C -88 -26, -96 -26, -104 -22" fill="none" stroke="#A7F3D0" stroke-width="1" stroke-linecap="round" opacity="0.6" />
      <path d="M -70 -18 C -76 -10, -84 -6, -92 -8" fill="none" stroke="#6EE7B7" stroke-width="1" stroke-linecap="round" opacity="0.5" />

      <!-- Dewdrop on Leaf 2 -->
      <ellipse cx="-86" cy="-22" rx="2.8" ry="2" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- ========== LEAF 3: Right Branch Flourishing Leaf ========== -->
    <g id="Leaf3">
      <!-- Leaf Body -->
      <path d="M 44 -26
               C 62 -52, 98 -56, 108 -38
               C 98 -18, 68 -8, 44 -26 Z"
            fill="url(#thirdLeafGrad)" />

      <!-- Leaf Central Vein -->
      <path d="M 44 -26 C 66 -36, 88 -38, 108 -38"
            fill="none" stroke="#ECFDF5" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />

      <!-- Lateral veins -->
      <path d="M 60 -31 C 68 -40, 78 -42, 88 -40" fill="none" stroke="#D1FAE5" stroke-width="1" stroke-linecap="round" opacity="0.55" />
      <path d="M 58 -28 C 68 -22, 78 -18, 88 -22" fill="none" stroke="#A7F3D0" stroke-width="1" stroke-linecap="round" opacity="0.55" />
    </g>

    <!-- ========== LEAF 4: Delicate Young Sprout / Bud (Upper Spire) ========== -->
    <g id="SproutBud">
      <path d="M -52 -70
               C -58 -86, -68 -90, -64 -78
               C -60 -68, -54 -66, -52 -70 Z"
            fill="url(#budGrad)" />
      <path d="M -52 -70 C -57 -78, -63 -84, -64 -78"
            fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.7" />
    </g>

    <!-- Tiny Creative Light Sparks / Pollen Particles -->
    <circle cx="-132" cy="-98" r="2" fill="#FDE68A" opacity="0.85" />
    <circle cx="-100" cy="-122" r="1.5" fill="#34D399" opacity="0.9" />
    <circle cx="116" cy="-48" r="1.8" fill="#FDE68A" opacity="0.8" />
    <circle cx="-38" cy="-100" r="1.2" fill="#A7F3D0" opacity="0.75" />
    <circle cx="70" cy="-60" r="1.4" fill="#6EE7B7" opacity="0.8" />

  </g>
</svg>
